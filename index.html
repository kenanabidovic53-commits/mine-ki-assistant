<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Mein KI-Assistent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { font-family: system-ui,-apple-system,sans-serif; color-scheme: dark; }
    body { margin:0; background:#0b1020; color:#f8fafc; min-height:100vh; display:grid; place-items:center; }
    main { width:min(92vw,520px); background:#111827; border:1px solid #263244; border-radius:24px; padding:24px; box-sizing:border-box; }
    h1 { margin:0 0 8px; font-size:1.7rem; }
    .status { margin:18px 0; padding:14px; border-radius:14px; background:#182235; }
    button { width:100%; border:0; border-radius:14px; padding:15px; font-size:1rem; font-weight:700; margin:7px 0; }
    #toggle { background:#22c55e; color:#07110a; }
    #listen { background:#e5e7eb; color:#111827; }
    textarea { width:100%; min-height:110px; box-sizing:border-box; border-radius:14px; border:1px solid #334155; background:#0f172a; color:#fff; padding:12px; margin-top:10px; resize:vertical; }
    small { color:#94a3b8; display:block; margin-top:12px; line-height:1.4; }
  </style>
</head>
<body>
<main>
  <h1>Mein KI-Assistent</h1>
  <div class="status" id="status">🎙️ Aktiv – bereit für Sprachbefehle</div>
  <button id="toggle">🔇 Stumm schalten</button>
  <button id="listen">🎤 Jetzt zuhören</button>
  <textarea id="notes" placeholder="Notizen / erkannte Sprachbefehle …"></textarea>
  <small>Stumm-/Aktiv-Status und Notizen werden nur lokal auf diesem Gerät gespeichert.</small>
</main>
<script>
const statusEl = document.querySelector('#status');
const toggle = document.querySelector('#toggle');
const listen = document.querySelector('#listen');
const notes = document.querySelector('#notes');

let muted = localStorage.getItem('assistantMuted') === 'true';
notes.value = localStorage.getItem('assistantNotes') || '';

function render() {
  statusEl.textContent = muted ? '🔇 Stumm – hört nicht zu' : '🎙️ Aktiv – bereit für Sprachbefehle';
  toggle.textContent = muted ? '🎙️ Aktivieren' : '🔇 Stumm schalten';
  listen.disabled = muted;
  listen.style.opacity = muted ? '.45' : '1';
}
toggle.onclick = () => {
  muted = !muted;
  localStorage.setItem('assistantMuted', muted);
  render();
};
notes.addEventListener('input', () => localStorage.setItem('assistantNotes', notes.value));

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRecognition) {
  listen.textContent = 'Spracherkennung hier nicht verfügbar';
  listen.disabled = true;
} else {
  const recognition = new SpeechRecognition();
  recognition.lang = 'de-DE';
  recognition.interimResults = false;
  recognition.continuous = false;

  listen.onclick = () => {
    if (muted) return;
    statusEl.textContent = '🎧 Ich höre zu …';
    recognition.start();
  };
  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    notes.value += (notes.value ? '\n' : '') + text;
    localStorage.setItem('assistantNotes', notes.value);
    statusEl.textContent = '✅ Sprachbefehl erkannt';
  };
  recognition.onerror = () => { statusEl.textContent = '⚠️ Spracherkennung konnte nicht gestartet werden'; };
  recognition.onend = () => setTimeout(render, 900);
}
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
</body>
</html>
