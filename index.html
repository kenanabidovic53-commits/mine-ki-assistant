<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Mein KI-Assistent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f4f6f8;color:#111827}
    main{max-width:720px;margin:auto;padding:24px}
    .card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 6px 22px #00000012}
    button{font:inherit;padding:12px 16px;border:0;border-radius:12px;margin:5px;cursor:pointer}
    .primary{background:#111827;color:white}.muted{background:#e5e7eb}
    #log{white-space:pre-wrap;min-height:90px}.status{font-weight:700}
  </style>
</head>
<body>
<main>
  <h1>Mein KI-Assistent</h1>
  <div class="card">
    <div id="status" class="status">🎙️ Aktiv – bereit für Sprachbefehle</div>
    <p id="prompt">Sag z. B. „Notiz: Milch kaufen“, „Erinnerung: morgen Müll rausbringen“ oder „Zusammenfassen: …“</p>
    <button id="mute" class="muted">🔇 Stumm schalten</button>
    <button id="listen" class="primary">🎤 Jetzt zuhören</button>
  </div>
  <div class="card">
    <h2>Notizen / erkannte Sprachbefehle</h2>
    <div id="log">Noch keine Einträge.</div>
  </div>
</main>
<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let muted=false, pending=null;
const statusEl=document.querySelector('#status'), promptEl=document.querySelector('#prompt'), logEl=document.querySelector('#log');
const say=t=>{ if('speechSynthesis' in window){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }};
const log=t=>{ logEl.textContent=(logEl.textContent==='Noch keine Einträge.'?'':logEl.textContent+'\n')+t; };
function confirmPending(text){
  const yes=/^(ja|jep|jawohl|passt|okay|ok)\b/i.test(text.trim());
  const no=/^(nein|nee|abbrechen|stopp)\b/i.test(text.trim());
  if(yes){
    if(pending.type==='note'){ localStorage.setItem('notes',JSON.stringify([...(JSON.parse(localStorage.getItem('notes')||'[]')),pending.text])); log('✅ Notiz gespeichert: '+pending.text); say('Gespeichert.'); }
    if(pending.type==='reminder'){ localStorage.setItem('reminders',JSON.stringify([...(JSON.parse(localStorage.getItem('reminders')||'[]')),pending.text])); log('✅ Erinnerung vorgemerkt: '+pending.text); say('Erinnerung vorgemerkt.'); }
    if(pending.type==='summary'){ log('✅ Zusammenfassung bestätigt: '+pending.text); say('Alles klar.'); }
    pending=null; promptEl.textContent='Bereit für den nächsten Befehl.'; return true;
  }
  if(no){ log('❌ Vorgang abgebrochen.'); pending=null; promptEl.textContent='Bereit für den nächsten Befehl.'; say('Abgebrochen.'); return true; }
  say('Bitte antworte mit Ja oder Nein.'); return true;
}
function handle(text){
  log('🗣️ '+text);
  if(pending) return confirmPending(text);
  let m;
  if((m=text.match(/^notiz[:\s]+(.+)/i))){
    pending={type:'note',text:m[1].trim()};
    promptEl.textContent='Notiz erkannt: „'+pending.text+'“ – speichern?';
    say('Ich habe verstanden: '+pending.text+'. Soll ich das speichern? Antworte mit Ja oder Nein.');
  } else if((m=text.match(/^erinnerung[:\s]+(.+)/i))){
    pending={type:'reminder',text:m[1].trim()};
    promptEl.textContent='Erinnerung erkannt: „'+pending.text+'“ – wirklich vormerken?';
    say('Ich habe verstanden: '+pending.text+'. Soll ich dich daran wirklich erinnern? Antworte mit Ja oder Nein.');
  } else if((m=text.match(/^zusammenfassen[:\s]+(.+)/i))){
    pending={type:'summary',text:m[1].trim()};
    promptEl.textContent='Verstanden: „'+pending.text+'“ – passt das so?';
    say('Ich habe verstanden: '+pending.text+'. Passt das so? Antworte mit Ja oder Nein.');
  } else {
    say('Diesen Befehl kenne ich noch nicht.');
    promptEl.textContent='Noch unbekannter Befehl. Nutze Notiz, Erinnerung oder Zusammenfassen.';
  }
}
document.querySelector('#mute').onclick=()=>{
  muted=!muted;
  statusEl.textContent=muted?'🔇 Stumm – hört nicht zu':'🎙️ Aktiv – bereit für Sprachbefehle';
  document.querySelector('#listen').disabled=muted;
  document.querySelector('#mute').textContent=muted?'🎙️ Aktivieren':'🔇 Stumm schalten';
};
document.querySelector('#listen').onclick=()=>{
  if(muted)return;
  if(!SR){ alert('Die Spracherkennung wird in diesem Browser nicht unterstützt.'); return; }
  const r=new SR(); r.lang='de-DE'; r.interimResults=false; r.maxAlternatives=1;
  statusEl.textContent='👂 Ich höre zu …';
  r.onresult=e=>handle(e.results[0][0].transcript);
  r.onerror=e=>{ statusEl.textContent='⚠️ Sprachfehler: '+e.error; };
  r.onend=()=>{ if(!muted) statusEl.textContent='🎙️ Aktiv – bereit für Sprachbefehle'; };
  r.start();
};
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
</script>
</body>
</html>
